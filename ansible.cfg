# ---------------------------------------------------------------------------
# INTERPRETER DISCOVERY CONFIGURATION
#
# 'auto_silent' tells Ansible to find Python automatically without printing warnings.
#
# RISKS OF 'auto': If a new Python version is installed on the remote node later,
# Ansible might switch to it. This can break playbooks if the new Python version
# lacks required system libraries/packages or has syntax incompatibilities.
#
# BEST PRACTICE: For production stability, lock this to an explicit path like:
# interpreter_python = /usr/bin/python3.13
# ---------------------------------------------------------------------------
[defaults]
interpreter_python = auto_silent
inventory = environments/dev/hosts
